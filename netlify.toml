# ==============================================================================
# NISHANTH PORTFOLIO — NETLIFY CONFIGURATION
# ==============================================================================

[build.environment]
  # Suppress secrets scanning for public identifiers and contact emails.
  # Netlify's scanner checks if any env var value appears in build/function output.
  # FIREBASE_PROJECT_ID is a public project identifier embedded by the Firestore SDK.
  # CONTACT_RECIPIENT_EMAIL is publicly displayed on the folio (footer/mailto).
  SECRETS_SCAN_OMIT_KEYS = "CONTACT_RECIPIENT_EMAIL,CONTACT_SENDER_EMAIL,FIREBASE_PROJECT_ID"
